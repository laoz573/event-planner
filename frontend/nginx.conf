server {
    listen 80;
    server_name localhost;

    # セキュリティ関連ヘッダーは本番では shared-proxy(../shared-proxy/nginx.conf)側で
    # 一括付与するため、ここでは設定しない(二重付与を避けるため)。

    # 本番ビルドは base='/planner/' のため、JS/CSSやAPIを /planner/... で読みに来る。
    # shared-nginx を経由せず直接アクセスした場合(例: http://localhost:81/)でも動くよう、
    # /planner/ を取り除いて下の location に回す(shared-nginx経由では既に取り除かれているので影響なし)。
    location ^~ /planner/ {
        rewrite ^/planner/(.*)$ /$1 last;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
