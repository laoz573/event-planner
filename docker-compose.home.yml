# 自宅など「その場でビルドせず、GHCRからpullしたイメージだけで動かしたい」環境向けの構成。
# docker-compose.yml との違いは backend/frontend が build: ではなく image: になっている点だけ
# (mysqlとポート構成・ネットワークはdocker-compose.ymlと同じ。shared-proxy-netやTLS終端は使わない、
#  単体のマシンで直接ポート公開する前提)。
#
# 事前に一度、Dockerが使える環境(このリポジトリを持っているPCなど)で `make push` を実行し、
# GHCRにイメージをpushしておく必要がある。その後はこのファイルで `docker compose pull && up -d` するだけでよい。
services:
  mysql:
    image: mysql:8.0
    container_name: event-planner-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-event-planner}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - event-planner-net

  backend:
    image: ${REGISTRY:-ghcr.io/laoz573}/event-planner-backend:${TAG:-latest}
    container_name: event-planner-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-event-planner}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET を.envに設定してください}
    ports:
      - "8001:8000"
    networks:
      - event-planner-net

  frontend:
    image: ${REGISTRY:-ghcr.io/laoz573}/event-planner-frontend:${TAG:-latest}
    container_name: event-planner-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - event-planner-net

volumes:
  mysql_data:

networks:
  event-planner-net:
    driver: bridge
